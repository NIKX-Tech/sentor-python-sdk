[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentor-python-sdk"
version = "2.0.0"
description = "Official Python SDK for the Sentor API — entity-based sentiment analysis, document clustering, and topic naming"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "NIKX Technologies B.V.", email = "sentor@nikx.one" }]
keywords = ["sentiment-analysis", "nlp", "bert", "sdk", "sentor", "aspect-based-sentiment-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://sentor.app"
Documentation = "https://sentor.app/docs"
Repository = "https://github.com/NIKX-Tech/sentor-ml-python-sdk"
"Get API Key" = "https://dashboard.sentor.app/settings?tab=api-access"

[tool.hatch.build.targets.wheel]
packages = ["sentor"]
